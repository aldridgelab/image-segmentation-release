# TB U-Net with Attention Gates
# Use this for potentially better feature focusing

# Data paths
data_dir: "session_output"
image_dir: "data/images"
channels: [0]
pad_multiple: 32

# Model architecture
in_channels: 1
num_classes: 3
base_channels: 64
depth: 4
use_attention: true  # Enable attention gates
bilinear: false

# Training
batch_size: 16
num_workers: 4
epochs: 100
lr: 0.001
weight_decay: 0.0001
scheduler: "cosine"
scheduler_patience: 10
scheduler_factor: 0.5
early_stopping_patience: 20
mixed_precision: true
gradient_clip: 1.0

# Loss function
loss_type: "combined"
ce_weight: 1.0
dice_weight: 1.0
focal_gamma: 2.0
class_weights: null
class_weight_method: "inverse_sqrt_freq"

# Output
output_dir: "tb_unet/checkpoints"
experiment_name: "attention_v1"
save_every: 10
log_every: 10

# Weights & Biases
wandb_enabled: true
wandb_project: "tb_unet"
wandb_entity: null
wandb_tags:
  - "attention"
  - "phase-only"
